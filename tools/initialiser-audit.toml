# The audit of the Microkit SDK's capDL initialiser: every crate compiled into initialiser.elf, the initial task the
# Microkit tool packs into every loader.img. tools/image-components.toml's
# [sdk.initialiser] names this file, and tools/image-sbom lists each crate
# below inside the initialiser in every image's SBOM, with its licence and
# where its sign-off stands.
#
# What the initialiser is: Microkit's own `initialiser` crate, a wrapper of
# rust-sel4's `sel4-capdl-initializer`, which Microkit's build_sdk.py builds
# for every board and configuration with
#     RUSTC_BOOTSTRAP=1 SEL4_PREFIX=<that build's seL4> cargo build \
#         --target aarch64-unknown-none --locked --release -p initialiser
# against the workspace Cargo.lock of the release's tag, with the Rust its
# flake pins (1.94.0). The standard library is Rust's prebuilt one for the
# target (no build-std).
#
# How the list was made (2026-10-04, in scratch containers from the dev
# image): cargo's unit graph for that command in Microkit 2.3.1's source at
# its tag (Cargo.lock sha256
# 3fba64e70688e6766f697499d3aad74474a8b99d3bef32f751c075e97e38b3e2): the 38
# packages compiled for aarch64-unknown-none, plus core, alloc and
# compiler_builtins. Licences come from each crate's manifest; every source
# file of the rust-sel4 crates was read for its SPDX tag. The binaries agree:
# each initialiser.elf of the pinned SDK's qemu_virt_aarch64 and rpi5b_2gb
# boards, debug and release, names rustc 1.94.0 (4a4ef493e 2026-03-02) in its
# .comment section; its panic locations name rust-sel4's checkout at dbe6445,
# log 0.4.33, miniz_oxide 0.9.1 and rkyv 0.8.17; and its symbols name only
# crates listed here. It was not rebuilt bit for bit. The linux-x86-64
# archive, the other one pinned, holds the same initialiser: its 159
# initialiser.elf files are byte for byte the linux-aarch64 archive's. What
# only built it - build scripts, proc macros and their dependencies, 48
# crates - none of it is in the binary.
#
# The audit holds only for the SDK and target [audit] names. When the
# Containerfile pins another SDK, image-sbom marks the initialiser
# 'composition unaudited' again, until the audit is re-run for the new SDK
# and this file updated in the same change (tools/container/README.md,
# "Changing a pin").
#
# A crate whose licence needs more than the house list (MIT, Apache-2.0,
# BSD-2-Clause, BSD-3-Clause, ISC) says where its sign-off stands:
# `signed-off = "YYYY-MM-DD"`, the day the maintainer signed it off, or `pending = "..."`, what it
# awaits. image-sbom refuses such a crate with neither, and refuses an
# [sdk.initialiser] composition that claims more than this file shows: it is
# "audited, sign-off pending" while any crate is pending, "audited" only once
# none is.

[audit]
date = "2026-10-04"
# The SDK audited: the Containerfile's MICROKIT_VERSION and both archives' sha256.
sdk = "2.3.1"
sdk-sha256-arm64 = "979553f288e8e2c099dae8fbec86cbe2cfda2ca006ee36de8234649d6d23bbee"
sdk-sha256-amd64 = "b1b285b8785db7557eba6d0665dd4fbf2f265ea5c0b39d6f91ae3dcc43d2c424"
# What the initialiser is built for: the SDK's AArch64 boards.
target = "aarch64-unknown-none"
# seL4/microkit's tag 2.3.1, and the rust-sel4 commit its Cargo.toml and Cargo.lock pin.
microkit-commit = "ec86afdcd662b5976d11d4994acf1b11a2979882"
rust-sel4-commit = "dbe6445d56059ed9a757e53c7137892aece1d179"
rust = "1.94.0 (4a4ef493e 2026-03-02)"
established = "cargo's unit graph for build_sdk.py's initialiser build in Microkit 2.3.1's source at its tag, against its Cargo.lock; licences from each crate's manifest, rust-sel4's file by file; checked against each initialiser.elf's .comment section, panic locations and symbols, not rebuilt bit for bit; the linux-x86-64 archive's initialiser.elf files are byte for byte the linux-aarch64 archive's"
advisories = "None open: cargo-deny 0.20.2 (unmaintained, unsound and yanked all errors) over Microkit 2.3.1's Cargo.lock against the RustSec advisory database at ef6173cbc5c5 (2026-10-03); rkyv 0.8.17 is the release that fixes RUSTSEC-2026-0233, -0234 and -0235; no RustSec advisory for Rust's standard library affects 1.94.0"

# ---- Microkit's own crate -----------------------------------------------------

[[crates]]
name = "initialiser"
version = "2.3.1"
licence = "BSD-2-Clause"
source = "microkit"
note = "Microkit's initialiser/ crate: its Cargo.toml declares no licence; both its files carry SPDX-License-Identifier BSD-2-Clause"

