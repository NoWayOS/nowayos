[package]
name = "nowayos-dev-window"
description = "A developer's tool, host only: an application on nowayos-ui shown in a browser window on this machine, taking its clicks and keys as canonical input events"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[features]
default = ["ui"]
# The adapter for the usual application, one nowayos-ui tree (`ui::Ui`). Off,
# the crate is the window and its parsers alone, with no renderer and no font
# in its graph: what the fuzz harness takes.
ui = ["dep:nowayos-render-eg", "dep:nowayos-ui"]

[dependencies]
# Our own: the canonical input events, and the host's frame.
nowayos-input.workspace = true
nowayos-testkit.workspace = true
# For an application that is one tree (the `ui` feature): the UI core and
# its renderer.
nowayos-render-eg = { workspace = true, optional = true }
nowayos-ui = { workspace = true, optional = true }
# The frame's pixels.
embedded-graphics.workspace = true

[dev-dependencies]
nowayos-display.workspace = true
proptest.workspace = true

[lints]
workspace = true
