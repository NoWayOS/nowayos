[package]
name = "nowayos-dev-window"
description = "A developer's tool, host only: an application on nowayos-ui shown in a browser window on this machine, taking its clicks and keys as canonical input events"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
# Our own: the canonical input events, and the host's frame.
nowayos-input.workspace = true
nowayos-testkit.workspace = true
# For an application that is one tree: the UI core and its renderer.
nowayos-render-eg.workspace = true
nowayos-ui.workspace = true
# The frame's pixels.
embedded-graphics.workspace = true

[dev-dependencies]
nowayos-display.workspace = true
proptest.workspace = true

[lints]
workspace = true
