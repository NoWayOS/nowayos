# What the glyph atlases are made from, reviewed like the font itself.
# tools/glyph-atlas reads it: `make atlases` writes src/atlas/ from it, and
# `make atlases-check`, in make ci, writes the atlases again and fails on
# any difference. The tool checks every file below against its sha256 first,
# and fails naming any file in fonts/ that is not listed here.

# The notice that goes with every copy of the atlases and beside every
# image: each family's copyright line, then the licence's text, which each
# family's licence file below gives word for word after its own copyright
# line. `make atlases` writes it; `make atlases-check` fails if it differs.
notice = "OFL.txt"

# The families, each signed off, from the commit named, with the licence
# file as released there. The atlases are one crate, so all share one
# licence.
[[family]]
id = "next"
name = "Atkinson Hyperlegible Next"
licence = "OFL-1.1"
licence-file = "fonts/AtkinsonHyperlegibleNext-OFL.txt"
copyright = "Copyright 2020-2024 The Atkinson Hyperlegible Next Project Authors (https://github.com/googlefonts/atkinson-hyperlegible-next)"
repository = "https://github.com/googlefonts/atkinson-hyperlegible-next"
commit = "7925f50f649b3813257faf2f4c0b381011f434f1"
decision = "signed off by the maintainer, 2026-10-04; Italic and Bold Italic 2026-11-05"

# The monospace sibling, for code.
[[family]]
id = "mono"
name = "Atkinson Hyperlegible Mono"
licence = "OFL-1.1"
licence-file = "fonts/AtkinsonHyperlegibleMono-OFL.txt"
copyright = "Copyright 2020-2024 The Atkinson Hyperlegible Mono Project Authors (https://github.com/googlefonts/atkinson-hyperlegible-next-mono)"
repository = "https://github.com/googlefonts/atkinson-hyperlegible-next-mono"
commit = "154d50362016cc3e873eb21d242cd0772384c8f9"
decision = "signed off by the maintainer, 2026-11-05"

# Every file of each family in this crate, as released at its commit, with
# its version and sha256. A font's own name table must give the same
# version.
[[file]]
family = "next"
path = "fonts/AtkinsonHyperlegibleNext-Regular.ttf"
upstream = "fonts/ttf/AtkinsonHyperlegibleNext-Regular.ttf"
version = "2.001"
sha256 = "88ed5c31a71584c7772963b02d04bef1eb7e3d2e9c8b9cb204339b1f82cf432c"

[[file]]
family = "next"
