[package]
name = "nowayos-picture-show"
description = "Test instrument (#10084): the picture decoder PD's client and parent - sends it pictures, restarts it when it faults, and shows what it decodes through the UI loop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "nowayos-picture-show"
path = "src/main.rs"
test = false
bench = false

[dependencies]
nowayos-bounded.workspace = true
nowayos-display.workspace = true
nowayos-heap.workspace = true
nowayos-ipc.workspace = true
nowayos-picture-wire.workspace = true
nowayos-region.workspace = true
nowayos-render-eg.workspace = true
nowayos-restart = { workspace = true, features = ["parent"] }
nowayos-ui.workspace = true
nowayos-ui-loop.workspace = true
sel4-microkit.workspace = true

[lints]
workspace = true
