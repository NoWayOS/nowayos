[package]
name = "nowayos-camera-test"
description = "A test instrument: the client of the USB host PDs' rings of a camera's frames - each frame's record checked, its JPEG markers checked, counted and released - which dumps one frame on serial, base64 with a CRC-32 a line, for tools/serial-frame to save as a JPEG"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "nowayos-camera-test"
path = "src/main.rs"
test = false
bench = false

[dependencies]
nowayos-hw.workspace = true
nowayos-region.workspace = true
nowayos-usb.workspace = true
sel4-microkit.workspace = true

[lints]
workspace = true
