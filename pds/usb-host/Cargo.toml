[package]
name = "nowayos-usb-host"
description = "The USB host PD: drives one xHCI controller through nowayos-hw - RP1's on the Pi 5, QEMU's qemu-xhci - with no unsafe code of its own"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

# A library, so that a product's system can run the USB host PD from a
# program of its own (wrapping `init`), and the program NoWayOS's systems run
# (Showcase's kitchen sink).
[lib]
path = "src/lib.rs"
test = false
doctest = false
bench = false

[[bin]]
name = "nowayos-usb-host"
path = "src/main.rs"
test = false
bench = false

[dependencies]
nowayos-audio.workspace = true
nowayos-display.workspace = true
nowayos-hw.workspace = true
nowayos-input.workspace = true
nowayos-ipc.workspace = true
nowayos-region.workspace = true
nowayos-timer-api = { workspace = true, features = ["client"] }
nowayos-usb.workspace = true
sel4-microkit.workspace = true

[lints]
workspace = true
