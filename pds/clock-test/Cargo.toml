[package]
name = "nowayos-clock-test"
description = "Test instrument for systems/clock-test.system: stands in for the TLS PD as the clock PD's source, sending it good and bad samples, and for a PD that may only read the time"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "nowayos-clock-test"
path = "src/main.rs"
test = false
bench = false

[dependencies]
nowayos-clock-api = { workspace = true, features = ["client"] }
nowayos-ipc.workspace = true
nowayos-region.workspace = true
nowayos-time.workspace = true
nowayos-timer-api = { workspace = true, features = ["client"] }
sel4-microkit.workspace = true

[lints]
workspace = true
