[package]
name = "nowayos-virtio-input"
description = "in QEMU: the virtio-input driver PD - finds QEMU's virtio input devices and sets them up through nowayos-hw's virtio layer, with no unsafe code of its own"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

# A library, so that a product's system can run this PD from a program of its
# own (wrapping `init`), and the program NoWayOS's systems run.
[lib]
path = "src/lib.rs"
test = false
doctest = false
bench = false

[[bin]]
name = "nowayos-virtio-input"
path = "src/main.rs"
test = false
bench = false

[dependencies]
nowayos-hw.workspace = true
nowayos-input.workspace = true
nowayos-ipc.workspace = true
nowayos-region.workspace = true
sel4-microkit.workspace = true

[lints]
workspace = true
