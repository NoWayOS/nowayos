[package]
name = "nowayos-uart-input"
description = "A development route only: keys typed on a terminal attached to the board's debug UART, decoded into canonical key events for the input broker"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

# A library, so that a product's development system can run this input PD
# from a program of its own (wrapping `init`), and the program NoWayOS's
# systems run. A development-only program either way: tools/grant-rules.toml's
# [development_only] keeps it out of every product system - a product's own
# program by its name, which keeps the ending (PRODUCT-uart-input).
[lib]
path = "src/lib.rs"
test = false
doctest = false
bench = false

[[bin]]
name = "nowayos-uart-input"
path = "src/main.rs"
test = false
bench = false

[dependencies]
nowayos-hw.workspace = true
nowayos-input.workspace = true
nowayos-ipc.workspace = true
nowayos-region.workspace = true
nowayos-timer-api = { workspace = true, features = ["client"] }
sel4-microkit.workspace = true

[lints]
workspace = true
