[package]
name = "nowayos-display-stub"
description = "The display PD of ui-demo: announces a layout, checks each Present and hashes the frame it shows - and shows it on the board's framebuffer when its system grants one (the Pi 5's HDMI)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

# A library, so that a product system can run this display PD from a program
# of its own (wrapping `init`), and the program NoWayOS's systems run.
[lib]
path = "src/lib.rs"
test = false
doctest = false
bench = false

[[bin]]
name = "nowayos-display-stub"
path = "src/main.rs"
test = false
bench = false

[dependencies]
nowayos-display.workspace = true
nowayos-fb.workspace = true
nowayos-hw.workspace = true
nowayos-ipc.workspace = true
nowayos-region.workspace = true
nowayos-ui-loop.workspace = true
sel4-microkit.workspace = true

[lints]
workspace = true
