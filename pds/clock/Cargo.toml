[package]
name = "nowayos-clock"
description = "in QEMU: the clock PD; holds wall-clock time as an interval from the image's build time, moved only by samples on the rings its system grants, and answers readings"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

# A library, so that a product system can run the clock PD from a program of
# its own (wrapping `init`), and the program NoWayOS's systems run.
[lib]
path = "src/lib.rs"
test = false
doctest = false
bench = false

[[bin]]
name = "nowayos-clock"
path = "src/main.rs"
test = false
bench = false

[dependencies]
nowayos-clock-api.workspace = true
nowayos-region.workspace = true
nowayos-time.workspace = true
nowayos-timer-api = { workspace = true, features = ["client"] }
sel4-microkit.workspace = true

[lints]
workspace = true
