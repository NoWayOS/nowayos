[package]
name = "nowayos-input-broker"
description = "The input broker PD - merges the canonical events of every input source into one stream for the UI, each checked against the screen and each source held to its own rate"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

# A library, so that a product's system can run the broker from a program of
# its own (wrapping `init`), and the program NoWayOS's systems run.
[lib]
path = "src/lib.rs"
test = false
doctest = false
bench = false

[[bin]]
name = "nowayos-input-broker"
path = "src/main.rs"
test = false
bench = false

[dependencies]
nowayos-hw.workspace = true
nowayos-input.workspace = true
nowayos-ipc.workspace = true
nowayos-region.workspace = true
sel4-microkit.workspace = true

[lints]
workspace = true
