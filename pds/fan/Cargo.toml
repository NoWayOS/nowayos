[package]
name = "nowayos-fan"
description = "The fan PD: runs the Raspberry Pi 5's active cooler on RP1's PWM1 - full speed at start, then the device tree's cooling curve on the SoC's temperature, which it asks the firmware for - and logs the temperature and the fan's speed. A library a product's system runs from a program of its own, and the program NoWayOS's test system runs"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

# A library, so that a product's system can run the fan PD from a program of
# its own (wrapping `init`), and the program NoWayOS's systems run.
[lib]
path = "src/lib.rs"
test = false
doctest = false
bench = false

[[bin]]
name = "nowayos-fan"
path = "src/main.rs"
test = false
bench = false

[dependencies]
nowayos-hw.workspace = true
nowayos-timer-api = { workspace = true, features = ["client"] }
sel4-microkit.workspace = true

[lints]
workspace = true
