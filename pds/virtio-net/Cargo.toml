[package]
name = "nowayos-virtio-net"
description = "in QEMU: the NIC driver PD for virtio-net - passes frames between the card and one client through sDDF's network queues, never mapping the packet buffers, with no unsafe code of its own"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

# A library, so that a product's system can run this PD from a program of its
# own (wrapping `init`), and the program NoWayOS's systems run.
[lib]
path = "src/lib.rs"
test = false
doctest = false
bench = false

[[bin]]
name = "nowayos-virtio-net"
path = "src/main.rs"
test = false
bench = false

[dependencies]
nowayos-hw.workspace = true
nowayos-net.workspace = true
nowayos-region.workspace = true
sel4-microkit.workspace = true

[lints]
workspace = true
