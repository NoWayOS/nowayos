[package]
name = "nowayos-display-ramfb"
description = "in QEMU: the interactive demo's display PD - the display contract's display side, showing each frame on QEMU's ramfb"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

# A library, so that a product's system can run this PD from a program of its
# own (wrapping `init`), and the program NoWayOS's systems run.
[lib]
path = "src/lib.rs"
test = false
doctest = false
bench = false

[[bin]]
name = "nowayos-display-ramfb"
path = "src/main.rs"
test = false
bench = false

[dependencies]
nowayos-display.workspace = true
nowayos-hw.workspace = true
nowayos-ipc.workspace = true
nowayos-region.workspace = true
nowayos-ui-loop.workspace = true
sel4-microkit.workspace = true

[lints]
workspace = true
