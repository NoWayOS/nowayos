[package]
name = "nowayos-timer"
description = "The timer PD; answers other PDs' time requests from the counter, and alone holds the timer interrupt"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

# A library, so that a product system can run the timer PD from a program of
# its own (wrapping `init`), and the program NoWayOS's systems run.
[lib]
path = "src/lib.rs"
test = false
doctest = false
bench = false

[[bin]]
name = "nowayos-timer"
path = "src/main.rs"
test = false
bench = false

[dependencies]
nowayos-hw.workspace = true
nowayos-timer-api.workspace = true
sel4-microkit.workspace = true

[lints]
workspace = true
