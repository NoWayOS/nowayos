[package]
name = "nowayos-audio-loop"
description = "A test instrument: the audio client of one or two USB host PDs - a 440 Hz tone to the speaker, five seconds of the microphone recorded and played back to it, each heard through the rings a product's client uses. Never in a product's image"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "nowayos-audio-loop"
path = "src/main.rs"
test = false
bench = false

[dependencies]
nowayos-audio.workspace = true
nowayos-display.workspace = true
nowayos-ipc.workspace = true
nowayos-region.workspace = true
nowayos-usb.workspace = true
sel4-microkit.workspace = true

[lints]
workspace = true
