[package]
name = "nowayos-isolation-probe"
description = "Isolation tests: a PD that deliberately attempts one memory access it was not granted (test instrument, never in a product image)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "nowayos-isolation-probe"
path = "src/main.rs"
test = false
bench = false

[dependencies]
nowayos-region.workspace = true
sel4-microkit.workspace = true

# On the approved-`unsafe` list as a test instrument: making a forbidden
# memory access takes `unsafe`. It cannot inherit the workspace lints (they
# forbid `unsafe_code`), so these are the same lints with `unsafe_code` at
# deny; exactly one module (src/forbidden.rs) allows it. Keep in step with
# ../Cargo.toml.
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
# No panic inside a function that returns Result, and every #[allow] says why.
panic_in_result_fn = "deny"
allow_attributes_without_reason = "deny"
# No out-of-bounds panics and no unchecked arithmetic on lengths and offsets.
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
