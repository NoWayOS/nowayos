[package]
name = "nowayos-heap"
description = "A protection domain's heap arena: sel4-dlmalloc over a fixed static arena or a memory region of its own, counted - bytes in use, the peak, refusals (approved-unsafe crate)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# The allocator sel4-microkit's `heap_size` declares: dlmalloc over a static
# arena, behind a one-shot mutex (a PD has one thread). BSD-2-Clause, from
# the pinned rust-sel4; it brings dlmalloc and lock_api (MIT OR Apache-2.0).
sel4-dlmalloc = { git = "https://github.com/seL4/rust-sel4", rev = "d441a880938209f661201704dfbee7b91c5aa905" }
# MIT OR Apache-2.0, as sel4-microkit takes it.
one-shot-mutex = "=0.2.1"

# This crate is on the approved-`unsafe` list, so it cannot inherit the
# workspace lints (they forbid `unsafe_code`, and a forbid cannot be relaxed).
# The same lints, with `unsafe_code` at deny: exactly one module
# (src/counting.rs) allows it. Keep in step with ../Cargo.toml.
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
# No panic inside a function that returns Result, and every #[allow] says why.
panic_in_result_fn = "deny"
allow_attributes_without_reason = "deny"
# No out-of-bounds panics and no unchecked arithmetic on lengths and offsets.
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
