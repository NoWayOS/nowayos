[package]
name = "nowayos-supervisor"
description = "The fault policy's supervisor PD: stops and reports a faulted child, then resets the board through PSCI. A library a system runs from a program of its own that names its children, and the program NoWayOS's test systems run"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

# A library, so that a product system can run the supervisor from a program of
# its own that names its children (wrapping `init`), and the program
# NoWayOS's test systems run.
[lib]
path = "src/lib.rs"
test = false
doctest = false
bench = false

[[bin]]
name = "nowayos-supervisor"
path = "src/main.rs"
test = false
bench = false

[dependencies]
nowayos-fault.workspace = true
nowayos-fault-policy.workspace = true
nowayos-hw.workspace = true
nowayos-ipc.workspace = true
nowayos-region.workspace = true
sel4.workspace = true
sel4-microkit.workspace = true

[lints]
workspace = true
