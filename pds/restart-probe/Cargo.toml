[package]
name = "nowayos-restart-probe"
description = "The restart test: a parent that restarts its faulted child through the child's restart entry, the child, and the child's client (test instrument, never in a product image)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "nowayos-restart-probe"
path = "src/main.rs"
test = false
bench = false

[dependencies]
nowayos-ipc.workspace = true
nowayos-region.workspace = true
nowayos-restart = { workspace = true, features = ["entry", "parent"] }
sel4-microkit.workspace = true

[lints]
workspace = true
