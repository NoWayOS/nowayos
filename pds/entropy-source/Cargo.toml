[package]
name = "nowayos-entropy-source"
description = "The entropy PD: owns the device's random source - virtio-rng in QEMU - health-tests and conditions every byte into seeds, and keeps one consumer's seed ring full, overwriting each seed once taken. A library a product's system runs from a program of its own, and the program NoWayOS's systems run"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

# A library, so that a product's system can run this PD from a program of its
# own (wrapping `init`), and the program NoWayOS's systems run.
[lib]
path = "src/lib.rs"
test = false
doctest = false
bench = false

[[bin]]
name = "nowayos-entropy-source"
path = "src/main.rs"
test = false
bench = false

[dependencies]
nowayos-bounded.workspace = true
nowayos-hw.workspace = true
nowayos-ipc.workspace = true
nowayos-region.workspace = true
nowayos-rng-health.workspace = true
nowayos-seed.workspace = true
sel4-microkit.workspace = true

[lints]
workspace = true
