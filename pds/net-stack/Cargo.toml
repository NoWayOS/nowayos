[package]
name = "nowayos-net-stack"
description = "The network stack PD: smoltcp over the virtio-net driver's queues, seeded from its seed ring, on the timer PD's monotonic time; takes a DHCP lease, and drops and counts malformed and oversize frames"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

# A library, so that a product's system can run this PD from a program of its
# own (wrapping `init`), and the program NoWayOS's systems run.
[lib]
path = "src/lib.rs"
test = false
doctest = false
bench = false

[[bin]]
name = "nowayos-net-stack"
path = "src/main.rs"
test = false
bench = false

[dependencies]
nowayos-bounded.workspace = true
nowayos-display.workspace = true
nowayos-ip.workspace = true
nowayos-ipc.workspace = true
nowayos-socket.workspace = true
nowayos-net.workspace = true
nowayos-region.workspace = true
nowayos-seed.workspace = true
nowayos-timer-api = { workspace = true, features = ["client"] }
sel4-microkit.workspace = true

[lints]
workspace = true
