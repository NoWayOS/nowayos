[package]
name = "nowayos-update-pd"
description = "The update PD, the only PD that writes a boot slot or the update state - thin over nowayos-update's logic, with nowayos-signature's checks"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

# A library, so that a product system can run the update PD from a program of
# its own (wrapping `init`), and the program update-test runs; its storage
# protocol is the storage stand-in's too.
[lib]
path = "src/lib.rs"
test = false
doctest = false
bench = false

[[bin]]
name = "nowayos-update-pd"
path = "src/main.rs"
test = false
bench = false

[dependencies]
nowayos-ipc.workspace = true
nowayos-region.workspace = true
nowayos-signature.workspace = true
nowayos-update.workspace = true
sel4-microkit.workspace = true

[lints]
workspace = true
