# NoWayOS's fuzz harness: libFuzzer targets for the decoders of
# untrusted input, built and run by `make fuzz` in the dev container. A new
# parser of untrusted input gets its target here:
# a file in fuzz_targets/ and a [[bin]] below.
#
# A workspace of its own, so that libfuzzer-sys is in no other Cargo.lock: it
# and the libFuzzer sources it compiles are signed off for development and CI
# fuzzing only - never in
# a device image, a shipped crate or a product's Cargo.lock. The layout is the
# one cargo-fuzz expects; `make fuzz` passes cargo the same instrumentation
# flags, so the dev image needs no cargo-fuzz.

[package]
name = "nowayos-fuzz"
description = "libFuzzer targets for NoWayOS's decoders of untrusted input (make fuzz)"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.93"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
nowayos-audio = { path = "../crates/nowayos-audio" }
nowayos-input = { path = "../crates/nowayos-input" }
nowayos-gem = { path = "../crates/nowayos-gem" }
nowayos-ip = { path = "../crates/nowayos-ip" }
nowayos-ipc = { path = "../crates/nowayos-ipc" }
nowayos-net = { path = "../crates/nowayos-net" }
nowayos-seed = { path = "../crates/nowayos-seed" }
nowayos-signature = { path = "../crates/nowayos-signature" }
nowayos-signing = { path = "../crates/nowayos-signing" }
nowayos-socket = { path = "../crates/nowayos-socket" }
nowayos-time = { path = "../crates/nowayos-time" }
nowayos-tls-crypto = { path = "../crates/nowayos-tls-crypto" }
nowayos-update = { path = "../crates/nowayos-update" }
nowayos-usb = { path = "../crates/nowayos-usb" }
# Pictures received at run time (#10084): the decoder and its PD's records.
nowayos-picture-decode = { path = "../crates/nowayos-picture-decode" }
nowayos-picture-wire = { path = "../crates/nowayos-picture-wire" }
# The libFuzzer runtime, compiled from the C++ sources the crate bundles:
# development and CI fuzzing only (its licence: deny.toml).
libfuzzer-sys = "=0.4.13"

