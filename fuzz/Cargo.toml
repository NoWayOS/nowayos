[workspace]
members = ["."]

# The NoWayOS baseline (tools/baseline.toml), as in NoWayOS's other two
# workspaces.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
panic_in_result_fn = "deny"
allow_attributes_without_reason = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
undocumented_unsafe_blocks = "deny"

[profile.dev]
panic = "abort"

# make fuzz builds this profile: overflow checks on, as in every shipped
# build, and line tables for a crash's backtrace.
[profile.release]
overflow-checks = true
panic = "abort"
debug = "line-tables-only"

[[bin]]
name = "picture_records"
path = "fuzz_targets/picture_records.rs"
test = false
doc = false

